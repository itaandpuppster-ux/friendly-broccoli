<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shape Playground — a 3D toy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #14bdeb;
  }
  #scene { position: fixed; inset: 0; display: block; }
  .ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: max(4vh, 24px) 24px;
    z-index: 2;
  }
  .title-wrap { text-align: center; }
  h1 {
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.25);
  }
  h1 .a { color: #ffe14d; } h1 .b { color: #ff7ab6; } h1 .c { color: #7dffb2; }
  .subtitle {
    margin-top: 10px; font-size: clamp(0.9rem, 2.8vw, 1.15rem);
    color: rgba(255,255,255,0.92); font-weight: 500;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .bottom-bar {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
  }
  .btn {
    pointer-events: auto; cursor: pointer;
    border: none; border-radius: 999px;
    padding: 12px 22px; font-size: 1rem; font-weight: 700;
    font-family: inherit;
    color: #4a2c00; background: #ffe14d;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 10px 24px rgba(0,0,0,0.18);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active { transform: translateY(3px) scale(0.98); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .btn.alt { background: #ff7ab6; color: #4d0026; }
  .btn.alt2 { background: #7dffb2; color: #00401f; }
  #counter {
    position: fixed; top: max(2vh, 12px); right: 16px; z-index: 2;
    background: rgba(255,255,255,0.9); border-radius: 999px;
    padding: 8px 16px; font-weight: 800; color: #333;
    font-size: 0.95rem; box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="counter">popped: 0</div>
<div class="ui">
  <div class="title-wrap">
    <h1><span class="a">Shape</span> <span class="b">Play</span><span class="c">ground</span></h1>
    <div class="subtitle">drag to spin the world &bull; tap a shape to pop it &bull; tap empty space to add one</div>
  </div>
  <div class="bottom-bar">
    <button class="btn" id="btnRain">make it rain</button>
    <button class="btn alt" id="btnParty">party mode</button>
    <button class="btn alt2" id="btnReset">reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- setup ----------
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();

  // candy gradient sky via big sphere with vertex colors
  var skyGeo = new THREE.SphereGeometry(200, 32, 32);
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top: { value: new THREE.Color('#6ee7ff') },
      mid: { value: new THREE.Color('#14bdeb') },
      bot: { value: new THREE.Color('#a78bfa') }
    },
    vertexShader: 'varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'varying vec3 vPos; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
      'void main(){',
      '  float h = normalize(vPos).y * 0.5 + 0.5;',
      '  vec3 c = h > 0.5 ? mix(mid, top, (h-0.5)*2.0) : mix(bot, mid, h*2.0);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var sun = new THREE.DirectionalLight(0xfff2cc, 1.0);
  sun.position.set(10, 18, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xb2e6ff, 0.4);
  fill.position.set(-8, 6, -10);
  scene.add(fill);

  // ground: soft pastel disc
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(40, 64),
    new THREE.MeshStandardMaterial({ color: 0x9ff2c8, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -6;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- shapes ----------
  var COLORS = [0xff5e78, 0xffb830, 0xffe14d, 0x6ee7b7, 0x38bdf8, 0xa78bfa, 0xff7ab6, 0x34d399, 0xf97316];
  var GEOS = [
    function () { return new THREE.BoxGeometry(1.4, 1.4, 1.4); },
    function () { return new THREE.SphereGeometry(0.9, 24, 24); },
    function () { return new THREE.TorusGeometry(0.8, 0.32, 16, 32); },
    function () { return new THREE.IcosahedronGeometry(1); },
    function () { return new THREE.ConeGeometry(0.85, 1.6, 24); },
    function () { return new THREE.TorusKnotGeometry(0.6, 0.22, 64, 12); },
    function () { return new THREE.OctahedronGeometry(1.05); },
    function () { return new THREE.CylinderGeometry(0.7, 0.7, 1.3, 24); }
  ];

  var world = new THREE.Group();
  scene.add(world);
  var shapes = [];
  var particles = [];
  var popped = 0;
  var partyMode = false;
  var counterEl = document.getElementById('counter');

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeShape(pos) {
    var geo = pick(GEOS)();
    var mat = new THREE.MeshStandardMaterial({
      color: pick(COLORS), roughness: 0.35, metalness: 0.05
    });
    var m = new THREE.Mesh(geo, mat);
    m.castShadow = true;
    if (pos) {
      m.position.copy(pos);
    } else {
      m.position.set(rand(-11, 11), rand(-3.5, 7), rand(-11, 11));
    }
    var s = rand(0.7, 1.5);
    m.scale.set(s, s, s);
    m.userData = {
      baseY: m.position.y,
      bobSpeed: rand(0.5, 1.4),
      bobAmp: rand(0.25, 0.8),
      phase: rand(0, Math.PI * 2),
      spin: new THREE.Vector3(rand(-0.6, 0.6), rand(-0.6, 0.6), rand(-0.6, 0.6)),
      birth: performance.now(), // spawn pop-in animation
      targetScale: s,
      poppable: true
    };
    m.scale.set(0.001, 0.001, 0.001);
    world.add(m);
    shapes.push(m);
    return m;
  }

  function burst(pos, color) {
    for (var i = 0; i < 16; i++) {
      var g = Math.random() < 0.5
        ? new THREE.TetrahedronGeometry(0.18)
        : new THREE.BoxGeometry(0.22, 0.22, 0.22);
      var p = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        color: Math.random() < 0.5 ? color : pick(COLORS), roughness: 0.4
      }));
      p.position.copy(pos);
      p.userData = {
        vel: new THREE.Vector3(rand(-1, 1), rand(0.2, 1.4), rand(-1, 1)).normalize().multiplyScalar(rand(4, 9)),
        rot: new THREE.Vector3(rand(-6, 6), rand(-6, 6), rand(-6, 6)),
        life: 1
      };
      world.add(p);
      particles.push(p);
    }
  }

  function popShape(m) {
    if (!m.userData.poppable) return;
    m.userData.poppable = false;
    burst(m.position.clone(), m.material.color.getHex());
    world.remove(m);
    m.geometry.dispose(); m.material.dispose();
    shapes.splice(shapes.indexOf(m), 1);
    popped++;
    counterEl.textContent = 'popped: ' + popped;
  }

  for (var i = 0; i < 34; i++) makeShape();

  // ---------- camera orbit (drag + inertia) ----------
  var theta = 0.6, phi = 1.25, radius = 22;
  var thetaVel = 0;
  var dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0, downT = 0;

  function updateCamera() {
    phi = Math.max(0.5, Math.min(1.55, phi));
    camera.position.set(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(0, 0.5, 0);
  }

  function pointerPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    lastX = downX = p.x; lastY = downY = p.y;
    downT = performance.now();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    theta += dx * 0.006;
    phi -= dy * 0.005;
    thetaVel = dx * 0.006;
    lastX = p.x; lastY = p.y;
    if (e.cancelable) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var p = e.changedTouches ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : pointerPos(e);
    var moved = Math.hypot(p.x - downX, p.y - downY);
    var quick = performance.now() - downT < 400;
    if (moved < 10 && quick) handleTap(p.x, p.y);
  }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  // pinch / wheel zoom
  window.addEventListener('wheel', function (e) {
    radius = Math.max(10, Math.min(45, radius + e.deltaY * 0.02));
  }, { passive: true });
  var pinchDist = 0;
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2) {
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (pinchDist) radius = Math.max(10, Math.min(45, radius - (d - pinchDist) * 0.05));
      pinchDist = d;
      dragging = false;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', function () { pinchDist = 0; });

  // ---------- tap: pop or spawn ----------
  var raycaster = new THREE.Raycaster();
  var mouseV = new THREE.Vector2();

  function handleTap(x, y) {
    mouseV.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(mouseV, camera);
    var hits = raycaster.intersectObjects(shapes);
    if (hits.length) {
      popShape(hits[0].object);
    } else {
      // spawn on an invisible plane facing the camera through the origin
      var plane = new THREE.Plane(camera.getWorldDirection(new THREE.Vector3()).negate(), 0);
      var pt = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, pt);
      if (pt) {
        pt.clampScalar(-12, 12);
        var m = makeShape(pt);
        m.userData.baseY = pt.y;
      }
    }
  }

  // ---------- buttons ----------
  document.getElementById('btnRain').addEventListener('click', function () {
    var n = 14;
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var m = makeShape(new THREE.Vector3(rand(-11, 11), rand(14, 22), rand(-11, 11)));
          m.userData.falling = true;
          m.userData.fallVel = 0;
          m.userData.baseY = rand(-3.5, 6);
        }, i * 90);
      })(i);
    }
  });

  document.getElementById('btnParty').addEventListener('click', function (e) {
    partyMode = !partyMode;
    e.target.textContent = partyMode ? 'chill mode' : 'party mode';
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    while (shapes.length) {
      var m = shapes.pop();
      world.remove(m); m.geometry.dispose(); m.material.dispose();
    }
    popped = 0;
    counterEl.textContent = 'popped: 0';
    for (var i = 0; i < 34; i++) makeShape();
  });

  // ---------- resize ----------
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animate ----------
  var clock = new THREE.Clock();
  var hue = 0;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    // gentle auto-rotate + inertia
    if (!dragging) {
      theta += dt * 0.06 + thetaVel;
      thetaVel *= 0.94;
    }
    updateCamera();

    if (partyMode) {
      hue = (hue + dt * 0.15) % 1;
      skyMat.uniforms.top.value.setHSL(hue, 0.75, 0.72);
      skyMat.uniforms.mid.value.setHSL((hue + 0.12) % 1, 0.8, 0.6);
      skyMat.uniforms.bot.value.setHSL((hue + 0.25) % 1, 0.75, 0.7);
    }

    for (var i = 0; i < shapes.length; i++) {
      var m = shapes[i], u = m.userData;
      // pop-in scale
      var age = (performance.now() - u.birth) / 400;
      if (age < 1) {
        var e = 1 - Math.pow(1 - age, 3);
        var overshoot = 1 + 0.25 * Math.sin(age * Math.PI);
        var s = u.targetScale * e * overshoot;
        m.scale.set(s, s, s);
      } else if (m.scale.x !== u.targetScale) {
        m.scale.set(u.targetScale, u.targetScale, u.targetScale);
      }
      // falling rain shapes
      if (u.falling) {
        u.fallVel += dt * 14;
        m.position.y -= u.fallVel * dt;
        if (m.position.y <= u.baseY) { m.position.y = u.baseY; u.falling = false; }
      } else {
        m.position.y = u.baseY + Math.sin(t * u.bobSpeed + u.phase) * u.bobAmp;
      }
      var spinMul = partyMode ? 3 : 1;
      m.rotation.x += u.spin.x * dt * spinMul;
      m.rotation.y += u.spin.y * dt * spinMul;
      m.rotation.z += u.spin.z * dt * spinMul;
      if (partyMode) {
        m.material.color.setHSL((hue + i * 0.03) % 1, 0.85, 0.6);
      }
    }

    // confetti particles
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j], pu = p.userData;
      pu.vel.y -= dt * 12;
      p.position.addScaledVector(pu.vel, dt);
      p.rotation.x += pu.rot.x * dt;
      p.rotation.y += pu.rot.y * dt;
      pu.life -= dt * 0.9;
      var ps = Math.max(pu.life, 0.001);
      p.scale.set(ps, ps, ps);
      if (pu.life <= 0 || p.position.y < -6) {
        world.remove(p); p.geometry.dispose(); p.material.dispose();
        particles.splice(j, 1);
      }
    }

    renderer.render(scene, camera);
  }
  updateCamera();
  animate();
})();
</script>
</body>
</html>
